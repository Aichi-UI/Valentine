<!DOCTYPE html>
<html>
<head>
  <title>Important Question 💖</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #C8A2C8; /* Darker lavender purple */
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    h1 {
      margin-top: 100px;
      font-size: 40px;
      color: #5D3FD3; /* Dark purple text */
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: absolute;
    }

    #yes {
      background-color: #FF69B4;
      color: white;
      left: 40%;
      top: 50%;
    }

    #no {
      background-color: #444;
      color: white;
      left: 55%;
      top: 50%;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      color: #FF69B4;
      font-size: 24px;
      animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity:1; }
      100% { transform: translateY(-500px); opacity:0; }
    }

    /* GIF butterflies */
    .butterfly {
      position: absolute;
      width: 50px;
      height: 50px;
      animation: fly linear infinite;
    }
  </style>
</head>

<body>

<h1>Will you go on a date with me? 💕</h1>

<button id="yes" onclick="yesClicked()">Yes 💖</button>
<button id="no" onmouseover="moveButton()">No 🙈</button>

<!-- Butterflies using GIF -->
<div class="butterfly" style="left:10%; top:20%; animation-duration:12s;">
  <img src="butterfly.gif" alt="butterfly">
</div>
<div class="butterfly" style="left:70%; top:30%; animation-duration:15s;">
  <img src="butterfly.gif" alt="butterfly">
</div>
<div class="butterfly" style="left:50%; top:60%; animation-duration:18s;">
  <img src="butterfly.gif" alt="butterfly">
</div>
<div class="butterfly" style="left:30%; top:80%; animation-duration:20s;">
  <img src="butterfly.gif" alt="butterfly">
</div>

<script>
function moveButton() {
    var button = document.getElementById("no");
    var x = Math.random() * (window.innerWidth - 100);
    var y = Math.random() * (window.innerHeight - 50);
    button.style.left = x + "px";
    button.style.top = y + "px";
}

// Create floating hearts
function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.top = window.innerHeight + 'px';
    heart.innerHTML = '💖';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
}
setInterval(createHeart, 500);

function yesClicked() {
    document.body.innerHTML = `
      <h1>YAYYY!!! I knew you'd say yes 😍💘</h1>
      <img src="mypicture.jpeg" alt="Cute Picture" style="width:300px; margin-top:20px; border-radius:15px;">
    `;
}
</script>

</body>
</html>
