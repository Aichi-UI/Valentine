<!DOCTYPE html>
<html>
<head>
<title>Important Question 💖</title>
<style>
    body {
        text-align: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #ff9a9e, #fad0c4);
        height: 100vh;
        overflow: hidden;
    }

    h1 {
        margin-top: 100px;
        font-size: 40px;
    }

    button {
        padding: 15px 30px;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        position: absolute;
    }

    #yes {
        background-color: #ff4d6d;
        color: white;
        left: 40%;
        top: 50%;
    }

    #no {
        background-color: #444;
        color: white;
        left: 55%;
        top: 50%;
    }
</style>
</head>

<body>

<h1>Casandra Benitez, 
Will you go on a date with me? 💕</h1>

<button id="yes" onclick="yesClicked()">Yes 💖</button>
<button id="no" onmouseover="moveButton()">No 🙈</button>

<script>
function moveButton() {
    var button = document.getElementById("no");
    var x = Math.random() * window.innerWidth;
    var y = Math.random() * window.innerHeight;
    button.style.left = x + "px";
    button.style.top = y + "px";
}

function yesClicked() {
    document.body.innerHTML = "<h1>YAYYY!!! I knew you'd say yes 😍💘</h1>";
}
</script>

</body>
</html>
